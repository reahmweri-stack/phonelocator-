<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | PhoneLocator</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="top"><a class="brand" href="/">📍 PhoneLocator</a><span>Admin dashboard</span></header><main><section class="card">
<h1>Payment review</h1><div id="loginPanel"><p>Sign in to review M-Pesa submissions.</p><form id="loginForm" class="form"><label>Username</label><input id="username" required value="admin"><label>Password</label><input id="password" type="password" required><button class="button primary">Sign in</button></form></div>
<div id="dashboard" hidden><button class="button secondary" id="refresh">Refresh list</button><button class="button secondary" id="logout">Sign out</button><p id="adminMessage" class="result"></p><div class="tablewrap"><table><thead><tr><th>Submitted</th><th>Customer</th><th>Phone</th><th>Transaction</th><th>Status</th><th>Review</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<p class="muted">Verify the exact transaction in your M-Pesa records before approving. Never approve based only on a screenshot or customer claim.</p></section></main><script src="/admin.js"></script></body></html>
